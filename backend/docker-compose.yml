services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC (Spring AI uses this)
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
    depends_on:
      - qdrant

volumes:
  qdrant_data: